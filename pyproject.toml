[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nico"
version = "1.0.0"
description = "NICO: operator-aligned neural improvement for routing problems (TSP, road-network TSP, CVRP)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[tool.setuptools.packages.find]
include = ["nico*"]
